spring:
  datasource:
    url: jdbc:h2:mem:docreq-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        generate_statistics: true   # CachingAndQueryCountTest counts SQL statements

logging:
  level:
    # generate_statistics also logs a metrics block per session; keep the test output readable
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: WARN

app:
  storage:
    type: local
    local-root: ${java.io.tmpdir}/docreq-test-files
  scheduling:
    enabled: false      # tests call the jobs directly with a chosen time
  seed:
    enabled: true
  notifications:
    base-backoff: PT30S
    max-attempts: 3
