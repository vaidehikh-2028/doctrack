# Production profile (SPRING_PROFILES_ACTIVE=prod): PostgreSQL (e.g. RDS) + S3.
spring:
  datasource:
    url: ${DB_URL}            # jdbc:postgresql://<host>:5432/docreq
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update

app:
  jwt:
    secret: ${APP_JWT_SECRET}
  storage:
    type: s3
    s3:
      bucket: ${S3_BUCKET}
      region: ${AWS_REGION:ap-south-1}
  seed:
    enabled: ${SEED_DEMO_DATA:false}
