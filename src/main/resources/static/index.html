<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DocTrack · LNMIIT</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">D</span>
      <div>
        <div class="brand-name">DocTrack</div>
        <div class="brand-sub">Student Document Requests · LNMIIT</div>
      </div>
    </div>
    <div id="session" class="session hidden">
      <span id="who"></span>
      <span id="role" class="role-badge"></span>
      <button id="logout" class="btn ghost small">Log out</button>
    </div>
  </header>

  <nav id="tabs" class="tabs hidden" aria-label="Sections"></nav>

  <main id="app" class="container"></main>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
