# Local production-like stack: PostgreSQL + the app (local file storage instead of S3).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: docreq
      POSTGRES_USER: docreq
      POSTGRES_PASSWORD: docreq
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  app:
    build: .
    depends_on: [db]
    ports: ["8080:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/docreq
      DB_USERNAME: docreq
      DB_PASSWORD: docreq
      APP_JWT_SECRET: ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTMyYnl0ZXMhIQ==
      APP_STORAGE_TYPE: local          # use s3 + S3_BUCKET + AWS credentials for real S3
      APP_STORAGE_LOCAL_ROOT: /tmp/files
      SEED_DEMO_DATA: "true"

volumes:
  pgdata:
