name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- frontend: test, then build into src/main/resources/static so the backend tests serve it ----
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Frontend tests with coverage
        working-directory: frontend
        run: npm run coverage
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ---- backend ----
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test
        run: mvn -B verify

      # ---- full stack: the React UI driving the real API ----
      - name: Start backend
        run: |
          java -jar target/docreq-*.jar --app.scheduling.enabled=false > backend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8080/actuator/health && break; sleep 2; done
      - name: End-to-end UI tests against the running backend
        working-directory: frontend
        run: npm run test:e2e
        env:
          DOCTRACK_E2E_URL: http://localhost:8080

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            target/surefire-reports
            target/site/jacoco
            frontend/coverage
            backend.log
